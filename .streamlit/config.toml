[theme]
base = "light"
# Design system pass: a cool slate scale (a faint blue bias toward the
# navy accent) replaces the earlier warm cream palette, and the existing
# brand navy stays the one interactive accent -- see the --n-*/--a-* token
# comments in streamlit_app.py's injected stylesheet for the full scale
# this was drawn from. White text on this navy clears WCAG's 4.5:1
# minimum for normal text (the same contrast bar the previous coral
# primaryColor failed).
primaryColor = "#052D49"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#EEF1F5"
textColor = "#16212E"
font = "sans serif"

[browser]
gatherUsageStats = false
